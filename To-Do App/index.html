<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskMaster Pro</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div class="container">

    <!-- Header -->
    <div class="header">
      <div>
        <h1>TaskMaster Pro</h1>
        <p class="subtitle">Stay productive, stay ahead</p>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statActive">0</div>
        <div class="stat-label">Active</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statDone">0</div>
        <div class="stat-label">Done</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statOverdue">0</div>
        <div class="stat-label">Overdue</div>
      </div>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Add a new task..." />
        <button id="addBtn">+ Add</button>
      </div>
      <div class="input-row">
        <select id="prioritySelect">
          <option value="low">🟢 Low</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="high">🔴 High</option>
        </select>
        <select id="categorySelect">
          <option value="personal">👤 Personal</option>
          <option value="work">💼 Work</option>
          <option value="study">📚 Study</option>
          <option value="health">❤️ Health</option>
          <option value="other">📌 Other</option>
        </select>
        <input type="date" id="dueDateInput" />
      </div>
    </div>

    <!-- Search & Sort -->
    <div class="search-sort-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search tasks..." />
      </div>
      <select id="sortSelect">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="priority">By Priority</option>
        <option value="duedate">By Due Date</option>
        <option value="az">A → Z</option>
      </select>
    </div>

    <!-- Category Filter Pills -->
    <div class="category-pills">
      <button class="pill active" data-cat="all">All</button>
      <button class="pill" data-cat="personal">👤 Personal</button>
      <button class="pill" data-cat="work">💼 Work</button>
      <button class="pill" data-cat="study">📚 Study</button>
      <button class="pill" data-cat="health">❤️ Health</button>
      <button class="pill" data-cat="other">📌 Other</button>
    </div>

    <!-- Status Filter -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- Task List -->
    <ul id="taskList"></ul>

    <!-- Footer -->
    <div class="footer">
      <p id="taskCount">0 tasks remaining</p>
      <div class="export-btns">
        <button class="export-btn" id="exportCSV">📥 CSV</button>
        <button class="export-btn" id="exportPDF">📄 PDF</button>
        <button class="export-btn danger" id="clearCompleted">🗑 Clear Done</button>
      </div>
    </div>

  </div>

  <!-- Confetti Canvas -->
  <canvas id="confettiCanvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
